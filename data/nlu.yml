version: "3.1"

nlu:

# --- FLIGHT SEARCH ---
- intent: search_flight
  examples: |
    - I want to book a flight
    - Book me a flight from [Delhi](source) to [Dubai](destination)
    - Find flights from [Mumbai](source) to [Singapore](destination)
    - Show me flights to [Paris](destination)
    - Any flights on [10th July](travel_date)?
    - Are there flights from [Chennai](source) to [Kolkata](destination) on [15th August](travel_date)?
    - I want to fly to [Bangalore](destination) on [June 5th](travel_date)
    - Need a flight from [Hyderabad](source) to [London](destination)
    - Flying from [Pune](source) to [New York](destination) on [1st September](travel_date)

# --- SLOT FILLING DURING FORM ---
- intent: inform
  examples: |
    - [Delhi](source)
    - [Mumbai](source)
    - [Dubai](destination)
    - [Singapore](destination)
    - [10th July](travel_date)
    - [15th August](travel_date)
    - [June 5th](travel_date)
    - I want to go to [Dubai](destination)
    - Leaving from [Delhi](source)
    - Traveling on [10th July](travel_date)
    - I'm going to [Paris](destination)
    - From [Chennai](source)
    - To [Bangalore](destination)
    - [5th June](travel_date)
    - My travel date is [20th September](travel_date)
    - Source is [Kolkata](source)
    - Destination is [Goa](destination)

# --- GENERAL INTEREST IN TRAVEL ---
- intent: general_travel_interest
  examples: |
    - I want to travel
    - I'm planning a trip
    - Need help with travel
    - Help me book something
    - I want to go somewhere
    - Can you help with travel plans?

# --- HOTEL SEARCH ---
- intent: search_hotel
  examples: |
    - I want to book a hotel
    - Find me hotels in Goa
    - Show hotel options in Paris
    - I need a hotel in Dubai

# --- PACKAGE SUGGESTION ---
- intent: suggest_package
  examples: |
    - Suggest some travel packages
    - Any honeymoon packages?
    - Show me popular travel destinations
    - Best packages for family trip?

# --- TALK TO HUMAN AGENT ---
- intent: talk_to_agent
  examples: |
    - I want to talk to a human
    - Can I speak with an agent?
    - Need help from customer support
    - Connect me to someone

# --- LOOKUP TABLES TO AID ENTITY EXTRACTION ---
- lookup: source
  examples: |
    - Delhi
    - Mumbai
    - Chennai
    - Kolkata
    - Hyderabad
    - Pune
    - Bangalore

- lookup: destination
  examples: |
    - Dubai
    - Singapore
    - Paris
    - London
    - New York
    - Goa

- lookup: travel_date
  examples: |
    - 10th July
    - 15th August
    - June 5th
    - 1st September
    - 5th June
    - 20th September

# --- GREET ---
- intent: greet
  examples: |
    - hello
    - hi
    - hey
    - good morning
    - good evening
    - what's up
    - howdy
    - hey there

- intent: thank_you
  examples: |
    - thank you
    - thanks
    - thank you so much
    - appreciate it
    - thanks a lot
    - thx

- intent: restart_conversation
  examples: |
    - I want to start again
    - Let's start over
    - Begin from start
    - Restart
    - Start new search
    - start again
    - begin again
    - reset

- intent: search_more_flights
  examples: |
    - I want more options
    - Show me more flights
    - Search again
    - I want to look for different flights
    - Can I change my search?
    - Let me search again
    - Check other options
    - Show different flights

- intent: change_source
  examples: |
    - Sorry, I gave the wrong departure city
    - Actually, the source is different
    - I want to change my departure city
    - Actually it's [Mumbai](source), not [Delhi](source)
    - Please change the source to [Chennai](source)
    - I said the wrong source
    - Let me update the starting location
    - Sorry, Given the wrong departure city
    - I want to change my departure city
    - Please change the departure city
    - Change the departure city

- intent: change_destination
  examples: |
    - Sorry, I gave the wrong destination city
    - Actually, the destination is different
    - I want to change my destination city
    - Actually it's [Goa](destination), not [Dubai](destination)
    - Please change the destination to [Paris](destination)
    - I said the wrong destination
    - Let me update the destination city
    - Sorry, given the wrong destination
    - Change the destination city


# --- SYNONYMS ---
- synonym: Mumbai
  examples: |
    - Bombay

- synonym: Bangalore
