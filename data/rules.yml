version: "3.1"

rules:
- rule: Activate flight form
  steps:
    - intent: search_flight
    - action: flight_form
    - active_loop: flight_form

- rule: Submit flight form
  condition:
    - active_loop: flight_form
  steps:
    - action: flight_form
    - active_loop: null
    - action: action_search_flight

- rule: Respond to thank you
  steps:
    - intent: thank_you
    - action: utter_thank_you

- rule: Restart and greet
  steps:
    - intent: restart_conversation
    - action: action_restart
    - action: utter_greet



- rule: Say greet message on greeting
  steps:
    - intent: greet
    - action: utter_greet
