version: "3.1"

rules:
- rule: Activate flight form
  steps:
    - intent: search_flight
    - action: flight_form
    - active_loop: flight_form

- rule: Submit flight form
  condition:
    - active_loop: flight_form
  steps:
    - action: flight_form
    - active_loop: null
    - action: action_search_flight

- rule: Respond to thank you
  steps:
    - intent: thank_you
    - action: utter_thank_you

- rule: Restart and greet
  steps:
    - intent: restart_conversation
    - action: action_restart
    - action: utter_greet

- rule: Reset flight search and start again
  steps:
    - intent: search_more_flights
    - action: action_reset_flight_form
    - action: flight_form
    - active_loop: flight_form

- rule: Restart flight form from scratch
  steps:
    - intent: search_more_flights
    - action: action_reset_flight_form
    - action: flight_form
    - active_loop: flight_form


- rule: Change source city during flight form
  condition:
    - active_loop: flight_form
  steps:
    - intent: change_source
    - action: utter_ask_source
    - slot_was_set:
        - source: null

- rule: Change destination city during flight form
  condition:
    - active_loop: flight_form
  steps:
    - intent: change_destination
    - action: utter_ask_destination
    - slot_was_set:
        - destination: null

- rule: Handle destination correction
  steps:
    - intent: change_destination
    - action: flight_form
    - active_loop: flight_form

- rule: Handle source correction
  steps:
    - intent: change_source
    - action: flight_form
    - active_loop: flight_form


- rule: Handle source correction
  steps:
    - intent: change_source
    - action: flight_form
    - active_loop: flight_form

- rule: Handle destination correction
  steps:
    - intent: change_destination
    - action: flight_form
    - active_loop: flight_form


- rule: Say greet message on greeting
  steps:
    - intent: greet
    - action: utter_greet
