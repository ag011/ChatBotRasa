version: "3.1"

intents:
  - greet
  - search_flight
  - search_hotel
  - suggest_package
  - talk_to_agent
  - general_travel_interest
  - inform
  - thank_you
  - restart_conversation
  - search_more_flights
  - change_source
  - change_destination
  - affirm
  - deny

entities:
  - source
  - destination
  - travel_date

slots:
  source:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: source

  destination:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: destination

  travel_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: travel_date

  confirm_flight_details:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

responses:

  utter_ask_confirm_flight_details:
  - text: "Are you sure you are travelling from {source} to {destination} on {travel_date}?"

  utter_ask_source:
    - text: "Please provide the departure city."

  utter_ask_destination:
    - text: "Please provide the destination city."

  utter_ask_travel_date:
    - text: "On what date would you like to travel?"

  utter_talk_to_agent:
    - text: "Okay, connecting you to a human agent now."

  utter_ask_travel_type:
    - text: "Sure! Are you looking for flights, hotels, or a complete travel package?"

  utter_default:
    - text: "Sorry, I didn’t quite understand that. Are you looking for flights, hotels, or packages?"
  
  utter_greet:
    - text: "Hi there! 👋 I’m your travel assistant. How can I help you today?"
    - text: "Hello! Ready to plan your next adventure?"
    
  utter_thank_you:
    - text: "You're welcome! Let me know if you need anything else ✈️🏨"

actions:
  - action_search_flight
  - validate_flight_form
  - action_reset_flight_form


forms:
  flight_form:
    required_slots:
      - source
      - destination
      - travel_date
      - confirm_flight_details



